name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "shared/**"
      - "scripts/**"
      - "registry.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # e.g. BKLockly/ShallowEnd-Plugins — override on forked runners if needed
  REPO_SLUG: ${{ github.repository }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tag 存在性检查需要完整 tag 列表

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check formatting
        run: |
          find plugins -path '*/bof-launcher' -prune -o \
            -path '*/.zig-cache' -prune -o -path '*/zig-pkg' -prune -o \
            \( -name '*.zig' -o -name 'build.zig.zon' \) -print0 | xargs -0 zig fmt --check

      - name: Consistency check
        run: python3 scripts/check_consistency.py

      - name: Run plugin tests
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            [ -f "$dir/build.zig" ] || continue
            echo "== zig build test: $dir"
            (cd "$dir" && zig build test --summary all)
          done

      - name: Build & release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/built
          : > /tmp/built/list

          for dir in plugins/*/; do
            [ -f "$dir/plugin.json" ] || continue
            name=$(python3 -c "import json;print(json.load(open('$dir/plugin.json'))['name'])")
            version=$(python3 -c "import json;print(json.load(open('$dir/plugin.json'))['version'])")
            ptype=$(python3 -c "import json;print(json.load(open('$dir/plugin.json')).get('type','native'))")
            tag="${name}-v${version}"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "== $name v$version: tag $tag already exists, skip"
              continue
            fi

            echo "== Building $name v$version ($tag, type=$ptype)"
            make -C "$dir" build-all
            ls -la "$dir/dist"

            gh release create "$tag" \
              --title "$name v$version" \
              --generate-notes \
              --latest=false \
              --draft=false \
              "$dir"/dist/*

            # 保险：确认 release 已发布（草稿状态会导致 releases/download 404）
            for i in 1 2 3; do
              if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false" ]; then
                break
              fi
              echo "release $tag is draft, retry publishing ($i/3)"
              gh release edit "$tag" --draft=false
              sleep 2
            done
            [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false" ] || {
              echo "ERROR: release $tag is still a draft"; exit 1;
            }

            echo "$dir" >> /tmp/built/list
          done

      - name: Update registry.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/built/list ]; then
            echo "No plugins built, registry unchanged"
            exit 0
          fi
          while IFS= read -r dir; do
            name=$(python3 -c "import json;print(json.load(open('$dir/plugin.json'))['name'])")
            version=$(python3 -c "import json;print(json.load(open('$dir/plugin.json'))['version'])")
            python3 scripts/update_registry.py \
              --name "$name" \
              --version "$version" \
              --repo-url "https://github.com/${REPO_SLUG}" \
              --release-url "https://github.com/${REPO_SLUG}/releases/tag/${name}-v${version}" \
              --artifacts-dir "$dir/dist" \
              --plugin-json "$dir/plugin.json" \
              --registry-path registry.json
          done < /tmp/built/list

          git add registry.json
          PLUGINS=$(cat /tmp/built/list | xargs -n1 basename | tr '\n' ' ')
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "ci: update registry for ${PLUGINS}[skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main

          # 主动刷新 jsDelivr 分支缓存（市场走 cdn.jsdelivr.net，分支引用默认缓存最长 12h）
          curl -sS -X POST "https://purge.jsdelivr.net/gh/${REPO_SLUG}@main/registry.json" || true
